name: Sing-Box reF1nd最新版检查同步

on:
  workflow_dispatch:
  schedule:
    # 中国时间 02:30
    - cron: '30 23 * * *'

permissions:
  contents: write

concurrency:
  group: repository-maintenance-reF1nd
  cancel-in-progress: false

env:
  PACKAGE_BRANCH: master

jobs:
  update:
    name: 检查并更新 Sing-Box reF1nd
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: 检出软件包仓库
        uses: actions/checkout@main
        with:
          fetch-depth: 0
          ref: ${{ env.PACKAGE_BRANCH }}

      - name: 同步 master 分支
        run: |
          source .github/scripts/ci-common.sh
          ci_sync_branch "$PACKAGE_BRANCH"

      - name: 检查 Sing-Box reF1nd上游版本
        id: upstream
        run: |
          makefile='sing-box/Makefile'

          # reF1nd/sing-box 本身不发布 Release，只打 tag，因此改用 tags 接口
          # 最新版需要包含 alpha/beta 预发布 tag，形如：
          #   v1.13.14-reF1nd(.N)?
          #   v1.14.0-alpha.50-reF1nd(.N)?
          #   v1.14.0-beta.2-reF1nd(.N)?
          upstream_tag="$(gh api 'repos/reF1nd/sing-box/tags?per_page=100' \
            --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z]+\.[0-9]+)?-reF1nd(\.[0-9]+)?$' \
            | sort -V | tail -n1)"

          if [[ -z "$upstream_tag" ]]; then
            echo "未找到 Sing-Box reF1nd tag" >&2
            exit 1
          fi

          [[ "$upstream_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)*$ ]]

          upstream_version="${upstream_tag#v}"
          current_version="$(sed -n 's/^PKG_UPSTREAM_VERSION:=//p' "$makefile")"

          changed=true

          if [[ "$current_version" == "$upstream_version" ]]; then
            changed=false
            echo "Sing-Box 已是最新版：$upstream_version"
          fi

          {
            echo "changed=$changed"
            echo "tag=$upstream_tag"
            echo "version=$upstream_version"
          } >> "$GITHUB_OUTPUT"

      - name: 下载并校验 Sing-Box reF1nd源码
        if: steps.upstream.outputs.changed == 'true'
        id: source
        env:
          UPSTREAM_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          archive="$RUNNER_TEMP/sing-box.tar.gz"

          curl -fL --retry 3 \
            "https://codeload.github.com/reF1nd/sing-box/tar.gz/$UPSTREAM_TAG" \
            -o "$archive"

          tar -tzf "$archive" >/dev/null

          echo "hash=$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: 更新 Sing-Box reF1nd软件包元数据
        if: steps.upstream.outputs.changed == 'true'
        env:
          SOURCE_HASH: ${{ steps.source.outputs.hash }}
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          makefile='sing-box/Makefile'

          # 最新版 tag 格式多样，例如：
          #   1.13.14-reF1nd / 1.13.14-reF1nd.1
          #   1.14.0-alpha.50-reF1nd / 1.14.0-alpha.46-reF1nd.1
          #   1.14.0-beta.2-reF1nd
          # OpenWrt PKG_VERSION 不能含 '-'，此处统一转小写并将 '-' 替换为 '_'
          if [[ ! "$UPSTREAM_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)*$ ]]; then
            printf '无法转换 Sing-Box 版本号：%s\n' "$UPSTREAM_VERSION" >&2
            exit 1
          fi

          package_version="$(tr '[:upper:]' '[:lower:]' <<<"$UPSTREAM_VERSION" | tr '-' '_')"

          sed -i \
            -e "s/^PKG_UPSTREAM_VERSION:=.*/PKG_UPSTREAM_VERSION:=$UPSTREAM_VERSION/" \
            -e "s/^PKG_VERSION:=.*/PKG_VERSION:=$package_version/" \
            -e 's/^PKG_RELEASE:=.*/PKG_RELEASE:=1/' \
            -e "s/^PKG_HASH:=.*/PKG_HASH:=$SOURCE_HASH/" \
            "$makefile"

          grep -Fx "PKG_UPSTREAM_VERSION:=$UPSTREAM_VERSION" "$makefile"
          grep -Fx "PKG_VERSION:=$package_version" "$makefile"
          grep -Fx 'PKG_RELEASE:=1' "$makefile"
          grep -Fx "PKG_HASH:=$SOURCE_HASH" "$makefile"

          git diff --check

      - name: 提交 Sing-Box reF1nd更新
        if: steps.upstream.outputs.changed == 'true'
        env:
          UPSTREAM_VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          source .github/scripts/ci-common.sh

          ci_commit_and_push \
            "$PACKAGE_BRANCH" \
            "chore: 更新 Sing-Box reF1nd至 ${UPSTREAM_VERSION}-r1" \
            sing-box/Makefile
